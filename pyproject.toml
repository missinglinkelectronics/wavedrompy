[build-system]
requires =[
    "setuptools >=61.0.0",
    "setuptools_scm",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "wavedrom"
version = "3.1.0"
description = "WaveDrom compatible python command line"
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "Aliaksei Chapyzhenka"},
    {name = "BreizhGeek"},
    {name = "Kazuki Yamamoto", email = "k4zuki@github.com"},
    {name = "Stefan Wallentowitz", email = "stefan@wallentowitz.de"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Documentation",
    "Topic :: Utilities",
]
requires-python = ">=3.7"
dependencies = [
    "Sphinx>=1.6.3",
    "svgwrite",
    "six",
    "pyyaml"
]

[project.urls]
    Homepage = "https://github.com/wallento/wavedrompy"
    Download = "https://pypi.org/project/wavedrom/"

[project.optional-dependencies]
CairoSVG = [
    "cairosvg>=1.0",
]

[tool.setuptools_scm]
write_to = "wavedrom/version.py"

[tool.setuptools]
py-modules = []
packages = ["wavedrom"]
